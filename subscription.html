<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MrVpn294 - Subscription</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; }
        .bg-animated {
            position: fixed; inset: 0; z-index: 0;
            background: linear-gradient(135deg, #0a0e1a 0%, #0f172a 25%, #0a0e1a 50%, #1e1b4b 75%, #0a0e1a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        @keyframes gradientShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .bg-animated::before {
            content: ''; position: absolute; inset: 0;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1920&q=80') center/cover no-repeat;
            opacity: 0.06;
        }
        .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.25; animation: float 8s ease-in-out infinite; }
        .orb-1 { width: 350px; height: 350px; background: rgba(99,102,241,0.3); top: -80px; left: -80px; }
        .orb-2 { width: 250px; height: 250px; background: rgba(139,92,246,0.2); bottom: -40px; right: -40px; animation-delay: 3s; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
        .glass { background: rgba(15,23,42,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .glass-card { background: rgba(15,23,42,0.5); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.06); transition: all 0.3s; }
        .glass-card:hover { border-color: rgba(99,102,241,0.3); transform: translateY(-2px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .glow-text { text-shadow: 0 0 20px rgba(99,102,241,0.5); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 3px; }
        .animate-in { animation: slideUp 0.6s ease-out forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.2s; } .delay-3 { animation-delay: 0.3s; }
        @keyframes slideUp { 0%{opacity:0;transform:translateY(30px)} 100%{opacity:1;transform:translateY(0)} }
        .config-item { background: rgba(15,23,42,0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 12px 16px; transition: all 0.2s; cursor: pointer; }
        .config-item:hover { background: rgba(99,102,241,0.08); border-color: rgba(99,102,241,0.2); }
        .copy-btn { background: linear-gradient(135deg, #6366f1, #8b5cf6); transition: all 0.3s; }
        .copy-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(99,102,241,0.4); }
    </style>
</head>
<body class="min-h-screen text-slate-200">
    <div class="bg-animated"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
    <div class="relative z-10 min-h-screen flex flex-col">
        <!-- Header -->
        <header class="glass border-b border-white/5">
            <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-purple-600 flex items-center justify-center shadow-lg shadow-brand-500/20">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    </div>
                    <span class="font-bold text-white">MrVpn294</span>
                </div>
                <span class="text-xs text-slate-500">Subscription</span>
            </div>
        </header>
        <!-- Content -->
        <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-8 space-y-6">
            <!-- Profile Card -->
            <div class="glass-card rounded-2xl p-6 animate-in delay-1">
                <div class="flex items-center gap-4 mb-6">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    </div>
                    <div>
                        <h1 id="profile-name" class="text-xl font-bold text-white">Loading...</h1>
                        <p id="profile-sub" class="text-sm text-slate-400">Fetching subscription data...</p>
                    </div>
                </div>
                <!-- Stats -->
                <div class="grid grid-cols-3 gap-3 mb-6">
                    <div class="text-center p-3 rounded-xl bg-white/[0.03] border border-white/5">
                        <p id="sub-traffic" class="text-lg font-bold text-white">-</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-wider">Traffic</p>
                    </div>
                    <div class="text-center p-3 rounded-xl bg-white/[0.03] border border-white/5">
                        <p id="sub-expire" class="text-lg font-bold text-white">-</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-wider">Expires</p>
                    </div>
                    <div class="text-center p-3 rounded-xl bg-white/[0.03] border border-white/5">
                        <p id="sub-status" class="text-lg font-bold text-emerald-400">-</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-wider">Status</p>
                    </div>
                </div>
            </div>
            <!-- Config List -->
            <div class="space-y-3 animate-in delay-2">
                <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider px-1">Available Configs</h2>
                <div id="config-list" class="space-y-2">
                    <div class="config-item flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-brand-500/10 flex items-center justify-center"><svg class="w-4 h-4 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg></div>
                            <div><p class="text-sm font-semibold text-white">Loading configs...</p><p class="text-xs text-slate-500">Fetching from server</p></div>
                        </div>
                        <button class="copy-btn px-3 py-1.5 rounded-lg text-xs font-bold text-white">Copy</button>
                    </div>
                </div>
            </div>
            <!-- QR Code -->
            <div class="glass-card rounded-2xl p-6 text-center animate-in delay-3">
                <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider mb-4">Scan to Connect</h3>
                <div id="qr-container" class="inline-flex items-center justify-center w-48 h-48 rounded-2xl bg-white/5 border border-white/10">
                    <svg class="w-12 h-12 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
                </div>
                <p class="text-xs text-slate-500 mt-3">Use V2RayNG, SingBox, or Clash to scan</p>
            </div>
        </main>
        <!-- Footer -->
        <footer class="text-center py-4 text-xs text-slate-600">
            Powered by <span class="text-brand-400 font-semibold">MrVpn294</span> • <a href="https://github.com/amirpocom63-del/mrvpnpanel" target="_blank" class="hover:text-brand-400 transition-colors">GitHub</a>
        </footer>
    </div>
    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 bg-emerald-600 text-white rounded-xl text-xs shadow-xl font-bold z-50';
                toast.textContent = 'Copied!';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            });
        }
    </script>
</body>
</html>
